server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API 只走 /logan-web/logan/*（后端 tomcat 的 /logan-web/logan/*）
    location /logan-web/logan/ {
        proxy_pass http://backend:8080/logan-web/logan/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 其余 /logan-web/* 与 / 都按静态资源给 SPA
    location /logan-web/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
