# Logan PoC —— NAS(z423) 单机部署清单。后端+DB+站点三件套，LLM 走 Spark(100.88.73.95:18300)。
# 用 docker compose -f docker-compose.poc.yml up -d --build 起。镜像走 daocloud 前缀避免 Docker Hub 直连超时。
version: "3.7"
services:
  backend:
    build:
      context: Server
      args:
        LOGAN_DB_HOST: db
        LOGAN_DB_PORT: "3306"
        LOGAN_DB_NAME: logan
        LOGAN_DB_USER: logan
        LOGAN_DB_PASSWORD: logan_poc_2026
    restart: unless-stopped
    mem_limit: 700m
    environment:
      # 图标等应用素材落盘目录，与容器生命周期解耦，重建镜像不丢
      JAVA_OPTS: "-Xms128m -Xmx384m -Dlogan.app.dir=/opt/logan-app-icons -Dfile.encoding=UTF-8"
    volumes:
      - ./data/app-icons:/opt/logan-app-icons
    ports: ["127.0.0.1:18888:8080"]
    networks: [logan-net]
    depends_on: { db: { condition: service_started } }
  db:
    image: docker.m.daocloud.io/library/mysql:8.0
    restart: unless-stopped
    mem_limit: 600m
    environment:
      MYSQL_DATABASE: logan
      MYSQL_USER: logan
      MYSQL_PASSWORD: logan_poc_2026
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes: ["./data/mysql:/var/lib/mysql"]
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=60"]
    networks: [logan-net]
  site:
    image: docker.m.daocloud.io/library/nginx:alpine
    restart: unless-stopped
    ports: ["127.0.0.1:18080:80"]
    volumes:
      - ./site/build:/usr/share/nginx/html:ro
      - ./site/logan_site_nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [logan-net]
networks:
  logan-net: { driver: bridge }
